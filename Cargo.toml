[workspace]
resolver = "2"
members = [
    "crates/scafonix-policy",
    "crates/scafonix-crypto",
    "crates/scafonix-vault",
    "crates/scafonix-cli",
    "crates/scafonix-server",
    "crates/scafonix-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["scafonix <dev@scafonix.com>"]
license = "BSL-1.1"

[workspace.dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "sha256", "std"] }
sha3 = { version = "0.10", default-features = false }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = "0.10"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
axum = "0.7"
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
rusqlite = { version = "0.32", features = ["bundled"] }
